name: BioOS CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  rust-kernel:
    name: Plane A Safety Kernel (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format gate (zero diffs allowed)
        run: cargo fmt --manifest-path crates/bioos-kernel/Cargo.toml -- --check

      - name: Clippy gate (zero warnings allowed)
        run: cargo clippy --manifest-path crates/bioos-kernel/Cargo.toml -- -D warnings

      - name: Linux release cdylib
        run: cargo build --release --manifest-path crates/bioos-kernel/Cargo.toml

      - name: Install Cortex-M target
        run: rustup target add thumbv7em-none-eabihf

      - name: no_std embedded build gate (Cortex-M4F)
        run: cargo build --lib --no-default-features --features no_std --target thumbv7em-none-eabihf --manifest-path crates/bioos-kernel/Cargo.toml

      - name: STM32F407VG board-support build gate (target-stm32 feature)
        run: cargo build --lib --no-default-features --features no_std,target-stm32 --target thumbv7em-none-eabihf --manifest-path crates/bioos-kernel/Cargo.toml

      - name: Unit tests
        run: cargo test --manifest-path crates/bioos-kernel/Cargo.toml

  python-services:
    name: Plane B / Enterprise Services (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned dependencies
        run: pip install -r requirements.txt

      - uses: dtolnay/rust-toolchain@stable

      - name: Build kernel cdylib
        run: cargo build --release --manifest-path crates/bioos-kernel/Cargo.toml

      - name: Service + bridge tests
        run: python -m pytest services/test_services.py services/test_kernel_bridge.py -v
        
      - name: SAM 3.1 Vision tests (mock mode)
        run: python -m pytest services/test_sam31_vision.py -v
        
      - name: vLLM Backend factory test
        run: |
          python -c "
          import sys
          sys.path.insert(0, 'services/cognitive_plane')
          from vllm_backend import create_backend, gpu_backend_configured
          backend = create_backend()
          print(f'Backend: {type(backend).__name__}')
          print(f'GPU configured: {gpu_backend_configured()}')
          assert hasattr(backend, 'generate_constrained_clinical_recommendation')
          print('vLLM factory test PASSED')
          "
    
  sam31-vision:
    name: SAM 3.1 Vision Engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Test SAM 3.1 MOCK mode
        run: python -m pytest services/test_sam31_vision.py -v
        
      - name: Test SAM 3.1 integration with COE
        run: |
          python -c "
          import sys, os
          sys.path.insert(0, 'services/cognitive_plane')
          import numpy as np
          from engine5_coe import ClinicalOversightEngine
          from sam31_vision import create_sam31_engine_from_env, SegmentationMode
          
          # Test engine creation
          coe = ClinicalOversightEngine(enable_sam31=True)
          assert coe._sam31_engine is not None
          print(f'SAM 3.1 Engine: {coe._sam31_engine.mode}')
          
          # Test frame processing
          frame = np.random.randint(0, 255, (480, 640, 3), dtype=np.uint8)
          result = coe.process_surgical_frame(frame, 'PT-TEST')
          assert result is not None
          assert 'segmentation' in result
          assert 'virtual_fixtures' in result
          assert 'surgical_phase' in result
          assert 'plane_a_payload' in result
          assert 'fhir_observation' in result
          assert 'merkle_hash' in result
          print(f'Phase: {result[\"surgical_phase\"]}')
          print(f'Fixtures: {len(result[\"virtual_fixtures\"])}')
          print(f'Structures: {[s.value for s in result[\"segmentation\"].structures]}')
          print('SAM 3.1 + COE integration test PASSED')
          "
    
  realtime-collab:
    name: Realtime Collaboration Service (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pylint

      - name: Lint realtime_collab code
        run: pylint services/command_center/realtime_collab tests

      - name: Run realtime_collab tests
        env:
          USE_FAKE_REDIS: "1"
        run: pytest -q services/command_center/realtime_collab tests -k "realtime_collab"

      - name: Build Docker image for realtime_collab
        run: |
          docker build -t realtime-collab:ci -f services/command_center/realtime_collab/Dockerfile .

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.12.0

      - name: Lint Helm chart
        run: helm lint deploy/helm/realtime-collab

  docker-build:
    name: Docker Multi-Stage Build
    runs-on: ubuntu-latest
    needs: [rust-kernel, python-services, sam31-vision]
    steps:
      - uses: actions/checkout@v4
      
      - name: Build Docker image
        run: docker build -t bioos:ci .
        
      - name: Test Docker image runs
        run: |
          docker run --rm -d --name bioos-test -p 8090:8090 bioos:ci
          sleep 10
          curl -f http://localhost:8090/api/health || (docker logs bioos-test && exit 1)
          docker stop bioos-test